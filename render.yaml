services:
  - type: web
    name: pupas-mayorista-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pupas-mayorista-db
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DUX_API_TOKEN
        sync: false
      - key: DUX_ID_EMPRESA
        sync: false
      - key: DUX_ID_SUCURSAL
        sync: false
      - key: DUX_ID_DEPOSITO
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WHATSAPP_EMPRESA
        sync: false
      - key: EMAIL_ADMIN
        value: pupaokk@gmail.com
      - key: WOOCOMMERCE_URL
        value: https://pupasmayorista.com.ar
      - key: WORDPRESS_ORIGIN_URL
        value: https://pupas.wnpower.host
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://mayorista-pupas-fe.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WORDPRESS_MIGRATION_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://mayorista-pupas-fe.vercel.app,https://pupasmayorista.com.ar,https://www.pupasmayorista.com.ar
      - key: DUX_ESCRITURA_HABILITADA
        value: "false"
      - key: DUX_ENVIO_AUTOMATICO_PEDIDOS_HABILITADO
        value: "false"
      - key: DUX_ID_PERSONAL_PEDIDOS_WEB
        sync: false
      - key: DUX_SINCRONIZACION_HABILITADA
        value: "false"
      - key: DUX_RECONCILIACION_RESERVA_MINUTOS
        value: "10"
      - key: SMTP_HABILITADO
        value: "false"
      - key: DUX_PERSONALES_PEDIDOS
        value: "1051689,796900"
      - key: DUX_LISTA_PRECIO_MAYORISTA_ID
        value: "4710"
      - key: DUX_LISTA_PRECIO_24_ID
        value: "43406"

databases:
  - name: pupas-mayorista-db
    plan: free
    databaseName: pupas_mayorista
    user: pupas_mayorista
