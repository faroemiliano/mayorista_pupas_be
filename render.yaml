services:
  - type: web
    name: pupas-mayorista-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pupas-mayorista-db
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DUX_API_TOKEN
        sync: false
      - key: DUX_ID_EMPRESA
        sync: false
      - key: DUX_ID_SUCURSAL
        sync: false
      - key: DUX_ID_DEPOSITO
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WHATSAPP_EMPRESA
        sync: false
      - key: EMAIL_ADMIN
        value: farixio.tech@gmail.com
      - key: CORS_ORIGINS
        sync: false
      - key: DUX_ESCRITURA_HABILITADA
        value: "false"
      - key: SMTP_HABILITADO
        value: "false"
      - key: DUX_PERSONALES_PEDIDOS
        value: "1051689,796900"
      - key: DUX_LISTA_PRECIO_MAYORISTA_ID
        value: "4710"
      - key: DUX_LISTA_PRECIO_24_ID
        value: "43406"
      - key: COMPRA_MINIMA_UNIDADES
        value: "6"

databases:
  - name: pupas-mayorista-db
    plan: free
    databaseName: pupas_mayorista
    user: pupas_mayorista
